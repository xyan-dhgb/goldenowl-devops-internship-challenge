name: Backend CD Pipeline - Deploy to Cloud Run

on:
  workflow_dispatch:

env:
  IMAGE_NAME: ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/goldenowl-devops-repo/app

jobs:
  deploy:
    name: Deploy latest image to Cloud Run
    runs-on: ubuntu-latest
    permissions:
      contents: "read"
      id-token: "write"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Deploy to Cloud Run
        run: |
          # Ensure APP_NAME format matches Terraform's normalization (replace _ with -)
          APP_NAME_NORMALIZED=$(echo "${{ vars.APP_NAME }}" | tr '_' '-')
          
          gcloud run deploy ${APP_NAME_NORMALIZED}-service \
            --image $IMAGE_NAME:latest \
            --region ${{ secrets.GCP_REGION }} \
            --project ${{ secrets.GCP_PROJECT_ID }}
