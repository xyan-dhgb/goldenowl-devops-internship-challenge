name: Backend CI Pipeline

on:
  workflow_dispatch:

env:
  IMAGE_NAME: ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/goldenowl-devops-repo/app

jobs:
  # JOB 1: LINT CODE
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "src/package-lock.json"

      - name: Install Dependencies
        working-directory: ./src
        run: npm ci

      - name: Run Lint
        working-directory: ./src
        run: npm run lint --if-present || npx eslint .

  # JOB 2: RUN UNIT TESTS
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "src/package-lock.json"

      - name: Install Dependencies
        working-directory: ./src
        run: npm ci

      - name: Run Tests
        working-directory: ./src
        run: npm test

  # JOB 3: BUILD, SCAN AND PUSH
  build-scan-push:
    name: Build, Scan and Push Docker Image
    needs: [lint, test]
    runs-on: ubuntu-latest
    permissions:
      contents: "read"
      id-token: "write"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ secrets.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Generate Timestamp Tag
        run: |
          export TZ="Asia/Ho_Chi_Minh"
          echo "IMAGE_TAG=$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_ENV

      - name: Build Docker Image
        working-directory: ./src
        run: |
          docker build -t $IMAGE_NAME:${{ env.IMAGE_TAG }} .

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"
          format: "table"
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

      - name: Push Docker Image to Artifact Registry
        run: |
          docker push $IMAGE_NAME:${{ env.IMAGE_TAG }}

  # JOB 4: NOTIFICATIONS AND REPORTING
  report:
    name: Generate Reports (Summary, PR Comment, Email)
    needs: [lint, test, build-scan-push]
    if: always()
    runs-on: ubuntu-latest

    # Give permission to write comment to Pull Request
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Generate Summary Markdown
        run: |
          cat << 'EOF' > summary.md
          ## CI Pipeline Results

          | Tiết trình (Job) | Trạng thái (Status) |
          | --- | ------ |
          | **Lint Code** | ${{ needs.lint.result == 'success' && 'Passed' || 'Failed' }} |
          | **Unit Tests** | ${{ needs.test.result == 'success' && 'Passed' || 'Failed' }} |
          | **Build & Scan & Push** | ${{ needs.build-scan-push.result == 'success' && 'Passed' || (needs.build-scan-push.result == 'skipped' && 'Skipped' || 'Failed') }} |

          - **Actor:** ${{ github.actor }}
          - **Commit (SHA):** ${{ github.sha }}
          - **Branch:** ${{ github.head_ref || github.ref_name }}
          EOF

      - name: Write to GitHub Actions Summary
        run: cat summary.md >> $GITHUB_STEP_SUMMARY

      - name: Comment on Pull Request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync('summary.md', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });
